<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tradesense</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1a1d23;
  --muted: #5f6672;
  --link: #1f5fbf;
  --line: #e3e6eb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a0c10;
    --text: #e6e8eb;
    --muted: #9aa1ac;
    --link: #7fb0ff;
    --line: #23272f;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 1.9rem; margin: 0.4em 0 0.1em; }
h2 { font-size: 1.15rem; margin: 2em 0 0.4em; padding-top: 1em; border-top: 1px solid var(--line); }
a { color: var(--link); }
.nav, .meta { color: var(--muted); font-size: 0.9rem; }
.nav a { color: var(--muted); }
ul { padding-left: 1.3em; }
li { margin: 0.3em 0; }
</style>
</head>
<body>
<main>
<h1>tradesense</h1>
<p class="meta">Market analysis for Android. tradesense provides analysis only and never places trades.</p>

<h2>Support</h2>
<p>For help, bug reports or general enquiries, please email <a href="mailto:tradesense.support@gmail.com">tradesense.support@gmail.com</a>. We aim to respond within a few business days.</p>

<h2>Legal</h2>
<ul>
<li><a href="privacy.html">Privacy Policy</a></li>
<li><a href="terms.html">Terms of Use</a></li>
</ul>
</main>
</body>
</html>
